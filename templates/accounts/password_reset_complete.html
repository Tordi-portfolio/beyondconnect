{% extends "base.html" %}
{% block title %}Password changed — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card center">
    <div style="font-size:3rem">✅</div>
    <h1>Password changed</h1>
    <p class="muted">Your password has been updated. You can now log in with it.</p>
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in</a>
  </div>
</div>
{% endblock %}
