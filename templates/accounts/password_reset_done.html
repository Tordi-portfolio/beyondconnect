{% extends "base.html" %}
{% block title %}Check your email — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card center">
    <div style="font-size:3rem">📧</div>
    <h1>Check your email</h1>
    <p class="muted">If an account exists for that address, we've sent instructions to reset your password. It should arrive in a few minutes.</p>
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to log in</a>
  </div>
</div>
{% endblock %}
